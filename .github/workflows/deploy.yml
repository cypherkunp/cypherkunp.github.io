name: Deploy

on:
  push:
    branches: [development]
  schedule:
    # Nightly refresh of pinned projects and contributions.
    # Scheduled runs only fire from the repository's default branch.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch GitHub data
        run: npm run fetch-data
        env:
          # Optional PROFILE_TOKEN (read-only fine-grained PAT) if the default token falls short.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
